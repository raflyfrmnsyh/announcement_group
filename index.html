<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pengumuman Kelompok Diklatsar Camp 2026</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- FontAwesome for Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            colors: {
              pmr: {
                50: "#fef2f2",
                100: "#fee2e2",
                500: "#ef4444",
                600: "#dc2626",
                700: "#b91c1c",
                800: "#991b1b",
              },
            },
          },
        },
      };
    </script>
    <style>
      /* Custom Background Pattern */
      .bg-pattern {
        background-color: #f9fafb;
        background-image: radial-gradient(#fee2e2 2px, transparent 2px);
        background-size: 30px 30px;
      }
      /* Float Animation */
      @keyframes float {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
        100% {
          transform: translateY(0px);
        }
      }
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }
    </style>
  </head>
  <body
    class="bg-[#a40328] min-h-screen flex items-center justify-center p-4 relative overflow-hidden"
  >
    <!-- Decorations -->
    <div
      class="absolute top-0 left-0 w-full select-none flex items-center justify-center py-4 md:py-8"
    >
      <img
        src="image/title-event.png"
        alt="decorations"
        class="w-[70%] sm:w-[50%] md:w-[24%] h-fit"
      />
    </div>
    <div class="bg-image absolute left-0 bottom-0 lg:h-screen -z-10">
      <img
        src="image/bg-mobile.png"
        alt="background"
        class="w-full h-full sm:hidden object-cover object-position-bottom pointer-events-none select-none"
      />
      <img
        src="image/bg-image.png"
        alt="background"
        class="w-full h-full hidden sm:block object-cover object-position-bottom pointer-events-none select-none"
      />
    </div>
    <!-- Main Card -->

    <div
      class="bg-white rounded-2xl shadow-lg p-6 sm:p-4 md:p-8 w-full max-w-md md:max-w-xl md:mt-12 relative z-10"
    >
      <!-- Header -->
      <div class="text-center mb-4">
        <div
          class="inline-flex items-center justify-center w-16 h-16 bg-pmr-50 text-pmr-600 rounded-full mb-4 shadow-sm border border-pmr-100"
        >
          <i class="fa fa-bullhorn text-3xl"></i>
        </div>
        <h1 class="text-xl sm:text-2xl font-bold text-gray-900 tracking-tight">
          Tergabung ke
          <span class="text-red-700">kelompok mana nich?</span>
        </h1>
        <p class="text-sm sm:text-base text-gray-500 font-medium">
          Pastikan Nama ditulis dengan lengkap.
        </p>
      </div>
      <div class="space-y-2">
        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"
          >
            <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
          </div>
          <input
            type="text"
            id="searchInput"
            placeholder="Masukkan Nama Lengkap Anda..."
            class="block w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-sm sm:text-base focus:ring-4 focus:ring-pmr-100 focus:border-pmr-500 focus:bg-white transition-all duration-300 outline-none placeholder-gray-400 shadow-sm"
          />
        </div>

        <button
          onclick="cariPeserta()"
          class="w-full group bg-red-700 hover:from-pmr-700 hover:to-pmr-600 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-pmr-500/30 transform transition-all duration-300 hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2"
        >
          <span>Cari Kelompok Saya</span>
          <i
            class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"
          ></i>
        </button>
      </div>

      <!-- Footer -->
      <div class="text-center border-t border-gray-100 pt-4">
        <p class="text-xs text-gray-400 font-medium">
          <i class="fa-solid fa-shield-halved mr-1"></i> PMR WIRA SMANTURA
          &copy; 2026. All Rights Reserved.
        </p>
      </div>
    </div>

    <!-- MODAL HASIL PENCARIAN -->
    <div
      id="resultBox"
      class="fixed inset-0 z-[9999] hidden items-center justify-center p-4"
    >
      <!-- Backdrop -->
      <div
        id="modalBackdrop"
        class="absolute inset-0 bg-black/60 backdrop-blur-sm"
        onclick="tutupModal()"
      ></div>

      <!-- Modal -->
      <div
        id="modalContent"
        class="relative w-full max-w-md bg-white rounded-3xl shadow-2xl transform scale-95 opacity-0 transition-all duration-300"
      >
        <!-- Isi akan diinject JavaScript -->
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
